name: Deploy to AWS EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ secrets.EC2_HOST != '' &&
          secrets.EC2_USER != '' &&
          secrets.EC2_SSH_PRIVATE_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.EC2_APP_DIR }}"
            if [[ -z "$APP_DIR" ]]; then
              APP_DIR="$HOME/ROUTINGv2"
            fi
            cd "$APP_DIR"
            export DEPLOY_BRANCH=main
            bash deploy/ec2/redeploy.sh
